[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["."]
omit = ["tests/*", "frontend-vue/*", "test-*.py", "*/test-*.py", "*/inline"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["frontend-vue"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
